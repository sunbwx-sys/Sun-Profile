<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffd1e8"/>
      <stop offset="55%" stop-color="#ff9ec7"/>
      <stop offset="100%" stop-color="#ff6fa8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f7"/>
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- 可爱的小心心装饰（左上角） -->
  <path d="M15 13c-1.2-1.6-3.8-1.6-5 0-0.8 1.1-0.2 2.6 1 3.6l4 3.4 4-3.4c1.2-1 1.8-2.5 1-3.6-1.2-1.6-3.8-1.6-5 0Z"
        fill="#ffffff" opacity="0.85"/>

  <!-- 汉字"哄" 白色圆润 -->
  <text x="32" y="41" text-anchor="middle"
        font-family='"ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif'
        font-size="32" font-weight="700"
        fill="url(#text)"
        filter="url(#soft)"
        letter-spacing="0">哄</text>

  <!-- 右下角小爱心 -->
  <path d="M50 49c-0.8-1-2.5-1-3.3 0-0.5 0.7-0.2 1.7 0.7 2.3l2.6 2.3 2.6-2.3c0.9-0.6 1.2-1.6 0.7-2.3-0.8-1-2.5-1-3.3 0Z"
        fill="#ffffff" opacity="0.9"/>
</svg>
